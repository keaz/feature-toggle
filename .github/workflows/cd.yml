name: CD

on:
  push:
    tags:
      - 'v*'

env:
  # The admin UI bundled into the backend archives. The UI lives in its own
  # repository and is released as the keaz/flux-gate-ui image. Empty: use the
  # newest vX.Y.Z tag of that image, so a new UI release ships with the next
  # backend release. Set a tag such as v1.2.0 to pin one.
  UI_VERSION: ''

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local123
          POSTGRES_DB: feature_toggle

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Postgres container ID
        id: postgres_container_id
        run: echo "POSTGRES_CONTAINER_ID=$(docker ps --filter 'ancestor=postgres:latest' -q)" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Apply schema migrations
        working-directory: ./feature-toggle-backend
        run: sqlx migrate run --database-url postgres://postgres:local123@localhost:5432/feature_toggle

      - name: Copy seed-only fixture script to the container
        run: docker cp ./init.sql ${{ env.POSTGRES_CONTAINER_ID }}:/init.sql

      - name: Seed fixture data from init.sql
        run: docker exec ${{ env.POSTGRES_CONTAINER_ID }} psql -U postgres -d feature_toggle -f /init.sql

      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Run coverage
        env:
          DATABASE_URL: postgres://postgres:local123@localhost:5432/feature_toggle
        run: |
          cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
            files: lcov.info
            flags: unittests
            fail_ci_if_error: true
            token: ${{ secrets.CODECOV_TOKEN }}

  # The built admin UI, copied out of the public UI image. The files are the
  # same for every platform. The backend serves its own /config.js, so the
  # image's is left out.
  ui:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Pick the UI version
        id: version
        run: |
          set -euo pipefail
          version="${UI_VERSION}"
          if [ -z "$version" ]; then
            version=$(curl -fsS 'https://hub.docker.com/v2/repositories/keaz/flux-gate-ui/tags?page_size=100' \
              | jq -r '.results[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          test -n "$version"
          echo "UI version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Copy the UI out of keaz/flux-gate-ui
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          id=$(docker create --platform linux/amd64 "keaz/flux-gate-ui:${VERSION}")
          docker cp "$id:/usr/share/nginx/html" ui
          docker rm "$id"
          rm -f ui/config.js
          test -f ui/index.html
          echo "$VERSION" > ui/VERSION
          ls ui

      - name: Upload the UI
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui/
          if-no-files-found: error

  # The backend, edge server and CLI for every platform the release supports.
  # The backend compiles its SQLx queries against the committed .sqlx cache, so
  # these builds need no database. The Linux builds run on Ubuntu 22.04 so the
  # binaries work on glibc 2.35 and later.
  binaries:
    needs: [test, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Download the UI
        uses: actions/download-artifact@v4
        with:
          name: ui
          path: pkg/backend/ui

      - name: Build
        env:
          SQLX_OFFLINE: 'true'
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p feature-toggle-backend -p feature-edge-server -p fluxgate-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bin="target/${{ matrix.target }}/release"
          suffix="${version}-${{ matrix.platform }}"
          mkdir -p dist pkg/backend pkg/edge pkg/cli
          test -f pkg/backend/ui/index.html

          cp "$bin/feature-toggle-backend" pkg/backend/fluxgate-backend
          cp release/backend-config.toml pkg/backend/config.toml
          cp release/log4rs.yaml release/README.md LICENSE pkg/backend/

          cp "$bin/feature-edge-server" pkg/edge/fluxgate-edge
          cp release/edge-config.toml pkg/edge/config.toml
          cp release/log4rs.yaml feature-edge-server/CONFIG.md LICENSE pkg/edge/

          cp "$bin/fluxgate" pkg/cli/
          cp fluxgate-cli/README.md LICENSE pkg/cli/

          tar -czf "dist/fluxgate-backend-${suffix}.tar.gz" -C pkg/backend .
          tar -czf "dist/fluxgate-edge-${suffix}.tar.gz" -C pkg/edge .
          tar -czf "dist/fluxgate-${suffix}.tar.gz" -C pkg/cli .
          ls -l dist

      - name: Upload the archives
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # One release with every archive, published only when all platforms built.
  release:
    needs: [binaries, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            The backend archives include the admin UI ${{ needs.ui.outputs.version }} in `ui/`.
            Checksums are in `SHA256SUMS`.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
